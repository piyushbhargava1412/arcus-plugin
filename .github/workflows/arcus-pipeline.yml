name: ARCUS pipeline

# Reusable workflow. A target repo vendors a ~25-line caller that invokes this:
#
#   jobs:
#     arcus:
#       uses: piyushbhargava1412/arcus-plugin/.github/workflows/arcus-pipeline.yml@v2
#       permissions: { contents: write, issues: write, pull-requests: write, copilot-requests: write }
#
# It must be a REUSABLE WORKFLOW, not a composite action: a composite action
# cannot set `concurrency` or `permissions`, and runs inside the caller's single
# job — so the 6-hour job cap would apply to the whole pipeline with no way to
# segment it later.
#
# A labelled issue runs to a pull request. It stops only when a stage records
# open questions; answering them on the issue resumes it.

on:
  workflow_call:
    inputs:
      issue_number:
        description: "Issue to run the pipeline for"
        required: true
        type: number
      plugin_ref:
        description: "arcus-plugin ref to install (tag, branch or SHA)"
        required: false
        type: string
        default: "main"
      plugin_repo:
        required: false
        type: string
        default: "piyushbhargava1412/arcus-plugin"
      state_branch:
        required: false
        type: string
        default: "arcus-state"

jobs:
  pipeline:
    name: "ARCUS: issue #${{ inputs.issue_number }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # Per-issue, so two stories can run in parallel. NEVER cancel-in-progress:
    # cancelling mid-stage leaves a stage `in_progress` with a half-written
    # artifact and no way to tell that from a crash.
    concurrency:
      group: arcus-${{ github.repository }}-${{ inputs.issue_number }}
      cancel-in-progress: false

    steps:
      # --- Trust boundary --------------------------------------------------
      # The gate is AUTHORSHIP, not repo visibility. Both the issue author and
      # whoever triggered the run must have write access, so a drive-by issue
      # body cannot be processed even if a maintainer mislabels it. Accepting
      # stories from arbitrary authors is deliberately out of scope.
      - name: Verify author and actor both have write access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          AUTHOR="$(gh api "repos/$REPO/issues/${{ inputs.issue_number }}" --jq .user.login)"
          for who in "$AUTHOR" "${{ github.actor }}"; do
            PERM="$(gh api "repos/$REPO/collaborators/$who/permission" --jq .permission 2>/dev/null || echo none)"
            case "$PERM" in
              admin|write) echo "$who: $PERM — ok" ;;
              *) echo "::error::$who has '$PERM' permission; ARCUS only runs on issues authored AND triggered by users with write access."; exit 1 ;;
            esac
          done

      - name: Refuse to run on a fork
        if: github.event.repository.fork == true
        run: |
          echo "::error::ARCUS does not run on forks."
          exit 1

      - uses: actions/checkout@v4
        with:
          # Credentials are injected only into the specific steps that push.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # --- Runtime ----------------------------------------------------------
      - name: Install ARCUS
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ inputs.plugin_ref }}" \
            "https://github.com/${{ inputs.plugin_repo }}.git" /tmp/arcus
          echo "ARCUS_HOME=/tmp/arcus/plugins/arcus" >> "$GITHUB_ENV"
          node -p "'arcus '+require('/tmp/arcus/plugins/arcus/.claude-plugin/plugin.json').version"

      - name: Stage helper scripts
        run: |
          # locate.sh short-circuits on an explicit ARCUS_HOME, so no probing and
          # no dependency on a host hook (Copilot never fires the bundled one).
          bash "$ARCUS_HOME/scripts/locate.sh"

      # --- State ------------------------------------------------------------
      - name: Pull existing state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "arcus[bot]"
          git config user.email "arcus@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          bash .arcus/bin/state_sync.sh pull "ISSUE-${{ inputs.issue_number }}" --branch "${{ inputs.state_branch }}"

      # The workflow is STATE-DRIVEN, exactly like arcus-controller: the trigger
      # only says "run ARCUS on issue N", and the checkpoint decides what that
      # means. No event-kind branching, so a label, a comment and a manual
      # dispatch all take the same path.
      - name: Decide what this run should do
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STORY_ID="ISSUE-${{ inputs.issue_number }}"
          CP=".arcus/specs/$STORY_ID/session-checkpoint.json"

          if [ ! -f "$CP" ]; then
            echo "mode=fresh" >> "$GITHUB_OUTPUT"
            echo "No checkpoint — starting Brainstorm from scratch."
            exit 0
          fi

          STATUS="$(node -p "require('./$CP').current_status || 'IN_PROGRESS'")"
          echo "checkpoint status: $STATUS"

          case "$STATUS" in
            COMPLETE|FAILED)
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              echo "Story is $STATUS — nothing to do." ;;
            AWAITING_HANDOFF)
              # Only meaningful if a human actually said something new. Ingest
              # exits 3 when there is nothing, so we stop before paying for an
              # agent run on a "thanks!" comment.
              set +e
              bash .arcus/bin/issue_ingest.sh "$STORY_ID" "${{ inputs.issue_number }}" --repo "${{ github.repository }}"
              rc=$?
              set -e
              if [ "$rc" = "3" ]; then
                echo "mode=skip" >> "$GITHUB_OUTPUT"
                echo "Awaiting a reply, but no new comments — stopping."
              elif [ "$rc" != "0" ]; then
                echo "::error::issue_ingest.sh failed (exit $rc)"; exit "$rc"
              else
                echo "mode=resume" >> "$GITHUB_OUTPUT"
              fi ;;
            *)
              echo "mode=resume-plain" >> "$GITHUB_OUTPUT"
              echo "In progress — continuing from the checkpoint." ;;
          esac

      - name: Install Copilot CLI
        if: steps.decide.outputs.mode != 'skip'
        run: npm install -g @github/copilot

      - name: Materialize the issue into a story
        if: steps.decide.outputs.mode == 'fresh'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .arcus/bin/issue_story.sh "${{ inputs.issue_number }}" --repo "${{ github.repository }}"

      # --- Run --------------------------------------------------------------
      - name: Run ARCUS
        if: steps.decide.outputs.mode != 'skip'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          ARCUS_ISSUE_NUMBER: ${{ inputs.issue_number }}
          MODE: ${{ steps.decide.outputs.mode }}
          STATE_BRANCH: ${{ inputs.state_branch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          STORY_ID="ISSUE-${{ inputs.issue_number }}"
          case "$MODE" in
            fresh) PROMPT_FILE="fresh-prompt.md" ;;
            *)     PROMPT_FILE="resume-prompt.md" ;;
          esac

          # Checkpoint BOTH the workspace and the story branch WHILE the agent
          # works. Nothing reaches the remote until closure otherwise: the
          # branch is created locally by branch.sh, committed to per task by
          # commit.sh, and pushed for the first time by pr.sh. So a timeout,
          # cancel or OOM discards the artifacts AND every commit — an hour of
          # generated code, not just bookkeeping. Pushing as it goes also makes
          # a long run observable instead of silent.
          #
          # The story-branch push uses GITHUB_TOKEN, which by design triggers no
          # workflows, so an in-progress branch cannot spam the target repo's CI.
          rm -f /tmp/pusher.stop
          (
            last=""
            while [ ! -f /tmp/pusher.stop ]; do
              sleep 45
              [ -f /tmp/pusher.stop ] && break

              # Story branch: exists only once the `branch` stage has run.
              cur="$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo '')"
              case "$cur" in
                arcus/*)
                  if git push --quiet --force-with-lease origin "$cur" 2>/dev/null; then
                    echo "[wip] pushed $cur"
                  fi ;;
              esac

              # Workspace artifacts. Hash first so an idle tick costs nothing.
              now="$(ls -lR ".arcus/specs/$STORY_ID" 2>/dev/null | shasum | cut -d' ' -f1)"
              [ "$now" = "$last" ] && continue
              if bash .arcus/bin/state_sync.sh push "$STORY_ID" --branch "$STATE_BRANCH" \
                   --message "chore(arcus-state): $STORY_ID in progress (run $RUN_ID)" >/dev/null 2>&1; then
                last="$now"
                echo "[state] checkpointed $STORY_ID"
              fi
            done
          ) &
          PUSHER_PID=$!
          # Stop the pusher before this step returns, so it can never race the
          # final push over the shared .arcus/.state-wt worktree.
          trap 'touch /tmp/pusher.stop; wait "$PUSHER_PID" 2>/dev/null || true' EXIT

          PROMPT="$(sed "s|{{STORY_ID}}|${STORY_ID}|g" \
            "$ARCUS_HOME/agent-resources/cloud/$PROMPT_FILE")"
          copilot --plugin-dir "$ARCUS_HOME" \
            --allow-all-tools --allow-all-paths \
            -p "$PROMPT" 2>&1 | tee /tmp/arcus.log

      # --- Persist + report --------------------------------------------------
      # `always()`: a run that dies mid-stage must still persist what it has, or
      # the next run redoes finished work.
      - name: Push the story branch
        if: always() && steps.decide.outputs.mode != 'skip'
        run: |
          set -euo pipefail
          cur="$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo '')"
          case "$cur" in
            arcus/*) git push --force-with-lease origin "$cur" && echo "pushed $cur" ;;
            *) echo "No story branch to push (branch stage has not run)." ;;
          esac

      - name: Push state
        if: always() && steps.decide.outputs.mode != 'skip' 
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash .arcus/bin/state_sync.sh push "ISSUE-${{ inputs.issue_number }}" \
            --branch "${{ inputs.state_branch }}" \
            --message "chore(arcus-state): ISSUE-${{ inputs.issue_number }} (run ${{ github.run_id }})" || true

      - name: Post open questions to the issue
        if: always() && steps.decide.outputs.mode != 'skip' 
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash .arcus/bin/questions_comment.sh "ISSUE-${{ inputs.issue_number }}" \
            "${{ inputs.issue_number }}" --repo "${{ github.repository }}" | tee /tmp/questions.out

      - name: Report the outcome on the issue
        if: always() && steps.decide.outputs.mode != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STORY_ID="ISSUE-${{ inputs.issue_number }}"
          CP=".arcus/specs/$STORY_ID/session-checkpoint.json"
          # Questions already got their own comment; do not double-post.
          if grep -q "QUESTIONS: [1-9]" /tmp/questions.out 2>/dev/null; then
            echo "Questions were posted — no status comment needed."; exit 0
          fi
          [ -f "$CP" ] || exit 0
          STATUS="$(node -p "require('./$CP').current_status" 2>/dev/null || echo UNKNOWN)"
          STAGE="$(node -p "require('./$CP').current_stage" 2>/dev/null || echo unknown)"
          PR_URL="$(gh pr list --repo "${{ github.repository }}" \
                      --search "$STORY_ID in:title" --state all \
                      --json url --jq '.[0].url' 2>/dev/null || true)"
          REASON="$(node -p "(require('./$CP').failure||{}).reason||''" 2>/dev/null || true)"
          # A prefilled compare link, when pr.sh could not open the PR itself.
          MANUAL_URL="$(grep -o 'PR_MANUAL_URL: .*' /tmp/arcus.log 2>/dev/null | tail -1 | sed 's/PR_MANUAL_URL: //')"
          {
            echo "<!-- arcus:v1 kind=status story=$STORY_ID -->"
            case "$STATUS" in
              COMPLETE) echo "### ARCUS finished" ;;
              FAILED)   echo "### ARCUS stopped at \`$STAGE\`" ;;
              *)        echo "### ARCUS paused at \`$STAGE\`" ;;
            esac
            echo ""
            [ -n "$PR_URL" ] && echo "Pull request: $PR_URL" && echo ""
            if [ -n "$MANUAL_URL" ]; then
              echo "**The branch is pushed and the work is done — this repository just does not allow Actions to open pull requests.**"
              echo ""
              echo "👉 **[Open the pull request]($MANUAL_URL)** — one click, title prefilled."
              echo ""
              echo "The description is ready at \`.arcus/specs/$STORY_ID/PR_DESCRIPTION.md\` on the \`${{ inputs.state_branch }}\` branch."
              echo ""
              echo "To let ARCUS do this itself: **Settings → Actions → General → Workflow permissions → _Allow GitHub Actions to create and approve pull requests_**."
              echo ""
            elif [ -n "$REASON" ]; then
              echo "\`\`\`"
              echo "$REASON"
              echo "\`\`\`"
              echo ""
            fi
            echo "<sub>status \`$STATUS\` · stage \`$STAGE\` · [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>"
          } > /tmp/status.md
          gh issue comment "${{ inputs.issue_number }}" --repo "${{ github.repository }}" --body-file /tmp/status.md

      - name: Summary
        if: always()
        run: |
          {
            echo "### ARCUS — issue #${{ inputs.issue_number }}"
            echo ""
            CP=".arcus/specs/ISSUE-${{ inputs.issue_number }}/session-checkpoint.json"
            if [ -f "$CP" ]; then
              echo "| field | value |"
              echo "|---|---|"
              echo "| status | \`$(node -p "require('./$CP').current_status" 2>/dev/null || echo '?')\` |"
              echo "| stage | \`$(node -p "require('./$CP').current_stage" 2>/dev/null || echo '?')\` |"
              echo ""
              echo "<details><summary>checkpoint</summary>"
              echo ""; echo '```json'; cat "$CP"; echo '```'; echo "</details>"
            else
              echo "_No checkpoint was written._"
            fi
            echo ""
            echo "$(cat /tmp/questions.out 2>/dev/null || echo 'QUESTIONS: (not reached)')"
          } >> "$GITHUB_STEP_SUMMARY"
